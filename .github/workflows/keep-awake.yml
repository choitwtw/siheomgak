name: 앱 깨워 두기

on:
  schedule:
    - cron: "23 * * * *"   # 매시간 (GitHub 예약 실행은 밀리거나 빠질 수 있어 여유 있게)
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py https://siheomgak.streamlit.app/
